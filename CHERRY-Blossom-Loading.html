<!DOCTYPE html>
<html lang="en">
<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Cherry Blossom Proxy Loading</title>
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500&display=swap" rel="stylesheet">
   <style>
       :root {
           --bg-color: #0f1016;
           --pink-color: #F591AF;
           --pink-glow: rgba(245, 145, 175, 0.6);
           --text-color: #FFFFFF;
       }


       body, html {
           margin: 0;
           padding: 0;
           width: 100%;
           height: 100%;
           background-color: var(--bg-color);
           font-family: 'Montserrat', sans-serif;
           overflow: hidden;
           perspective: 1000px;
       }


       /* --- Code-Generated Animated Background --- */
       #animated-bg {
           position: fixed;
           top: -5%;
           left: -5%;
           width: 110%;
           height: 110%;
           /* Solid fallback color if images are blocked */
           background-color: #1a0b18;
           /* Reliable image source */
           background-image: url('https://images.unsplash.com/photo-1522383225653-ed111181a951?ixlib=rb-4.0.3&auto=format&fit=crop&w=2000&q=80');
           background-size: cover;
           background-position: center;
           z-index: 0;
           animation: cinematicPan 35s ease-in-out infinite alternate;
       }


       /* Color shifting overlay for dynamic movement */
       #bg-overlay {
           position: fixed;
           top: 0; left: 0; width: 100vw; height: 100vh;
           background: linear-gradient(45deg, rgba(15,16,22,0.95) 0%, rgba(245,145,175,0.15) 100%);
           background-size: 200% 200%;
           z-index: 0;
           animation: colorShift 12s ease infinite alternate;
           pointer-events: none;
       }


       @keyframes cinematicPan {
           0% { transform: scale(1) translate(0, 0); }
           100% { transform: scale(1.08) translate(-2%, -3%); }
       }


       @keyframes colorShift {
           0% { background-position: 0% 50%; }
           100% { background-position: 100% 50%; }
       }


       /* --- Start Screen (Required for Audio) --- */
       #start-screen {
           position: fixed;
           top: 0;
           left: 0;
           width: 100vw;
           height: 100vh;
           background-color: rgba(15, 16, 22, 0.85);
           backdrop-filter: blur(8px);
           -webkit-backdrop-filter: blur(8px);
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           z-index: 10000;
           transition: opacity 0.8s ease, visibility 0.8s;
       }


       #start-btn {
           background: transparent;
           border: 1px solid var(--pink-color);
           color: var(--pink-color);
           padding: 15px 40px;
           font-family: 'Montserrat', sans-serif;
           font-size: 16px;
           font-weight: 300;
           letter-spacing: 4px;
           text-transform: uppercase;
           cursor: pointer;
           border-radius: 30px;
           transition: all 0.3s ease;
           box-shadow: 0 0 10px rgba(245, 145, 175, 0.1);
       }


       #start-btn:hover {
           background: rgba(245, 145, 175, 0.1);
           box-shadow: 0 0 20px rgba(245, 145, 175, 0.4);
           transform: scale(1.05);
       }


       /* --- Loading Screen Container --- */
       #loader-container {
           position: fixed;
           top: 0;
           left: 0;
           width: 100vw;
           height: 100vh;
           background: rgba(15, 16, 22, 0.8);
           backdrop-filter: blur(8px);
           -webkit-backdrop-filter: blur(8px);
           display: flex;
           flex-direction: column;
           justify-content: center;
           align-items: center;
           z-index: 9999;
           opacity: 0; /* Hidden initially */
           visibility: hidden;
           transition: opacity 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                       transform 1.2s cubic-bezier(0.4, 0, 0.2, 1),
                       filter 1.2s ease, visibility 1.2s;
       }


       #loader-container.active {
           opacity: 1;
           visibility: visible;
       }


       #loader-container.fade-out {
           opacity: 0;
           visibility: hidden;
           pointer-events: none;
           transform: scale(1.15);
           filter: blur(12px);
       }


       /* --- Logo Wrapper --- */
       .logo-wrapper {
           position: relative;
           width: 280px;
           height: 180px;
           margin-bottom: 30px;
           z-index: 10;
           filter: drop-shadow(0 0 20px rgba(245, 145, 175, 0.2));
           --mouseX: 0;
           --mouseY: 0;
           transform: translate(calc(var(--mouseX) * 15px), calc(var(--mouseY) * 15px))
                      rotateX(calc(var(--mouseY) * -10deg))
                      rotateY(calc(var(--mouseX) * 10deg));
           transition: transform 0.2s ease-out;
       }


       .logo-inner {
           width: 100%;
           height: 100%;
       }
      
       .active .logo-inner {
           animation: float 5s ease-in-out infinite 3s;
       }


       /* --- SVG Styling & Animation --- */
       svg {
           width: 100%;
           height: 100%;
           overflow: visible;
       }


       .animated-path {
           stroke-dasharray: 400;
           stroke-dashoffset: 400;
       }
      
       .active .animated-path {
           animation: drawLine 1.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
           animation-delay: var(--draw-delay, 0s);
       }


       .fill-shape {
           fill: transparent;
           stroke: var(--pink-color);
           stroke-width: 1.5;
           stroke-dasharray: 400;
           stroke-dashoffset: 400;
       }


       .active .fill-shape {
           animation: drawLine 1.5s cubic-bezier(0.4, 0, 0.2, 1) forwards,
                      fillPink 1.2s ease-out forwards;
           animation-delay: var(--draw-delay, 0s), var(--fill-delay, 1.5s);
       }


       .stroke-shape {
           fill: none;
           stroke: var(--pink-color);
           stroke-width: 2;
           stroke-linecap: round;
       }


       .stamen-line {
           fill: none;
           stroke: var(--bg-color);
           stroke-width: 1.2;
           stroke-dasharray: 50;
           stroke-dashoffset: 50;
       }


       .active .stamen-line {
           animation: drawLine 0.8s cubic-bezier(0.4, 0, 0.2, 1) forwards;
           animation-delay: var(--draw-delay, 2s);
       }


       .stamen-dot {
           fill: var(--bg-color);
           opacity: 0;
       }


       .active .stamen-dot {
           /* Chain the fade in followed by an infinite twinkle */
           animation: fadeIn 0.5s forwards, twinkle 2s ease-in-out infinite;
           animation-delay: var(--draw-delay, 2.5s), calc(var(--draw-delay, 2.5s) + 0.5s);
       }


       /* --- Shimmering Text Animation --- */
       .loading-text {
           font-size: 20px;
           font-weight: 500;
           letter-spacing: 15px;
           text-transform: uppercase;
           opacity: 0;
           z-index: 10;
           transform: translateY(20px);
           background: linear-gradient(90deg, #ffffff 0%, var(--pink-color) 50%, #ffffff 100%);
           background-size: 200% auto;
           color: transparent;
           -webkit-background-clip: text;
           background-clip: text;
       }


       .active .loading-text {
           animation: slideFadeUp 1.5s 1.5s forwards cubic-bezier(0.2, 0.8, 0.2, 1),
                      shimmer 4s linear infinite 3s,
                      breathe 3.5s ease-in-out infinite 3s;
       }


       /* --- Particle Effect System --- */
       #particles {
           position: absolute;
           top: 0;
           left: 0;
           width: 100%;
           height: 100%;
           overflow: hidden;
           z-index: 1;
           pointer-events: none;
       }


       .petal-wrapper {
           position: absolute;
           top: -30px;
           opacity: 0;
           /* Combines falling down with swaying left to right */
           animation: fall linear forwards, sway ease-in-out infinite alternate;
       }


       .petal {
           width: 100%;
           height: 100%;
           border-radius: 50% 0 50% 50%;
           background: linear-gradient(135deg, var(--pink-color) 0%, #ffffff 100%);
           box-shadow: inset 2px 2px 4px rgba(255,255,255,0.6),
                       0 0 8px rgba(245, 145, 175, 0.4);
           /* Adds independent 3D tumbling inside the wrapper */
           animation: tumble linear infinite;
           transform-origin: center;
       }


       /* --- Keyframes --- */
       @keyframes drawLine { to { stroke-dashoffset: 0; } }
      
       @keyframes fillPink {
           0% { fill: transparent; stroke: var(--pink-color); filter: drop-shadow(0 0 0px var(--pink-glow)); }
           60% { fill: #ffffff; filter: drop-shadow(0 0 15px var(--pink-color)); } /* Bloom effect */
           100% { fill: var(--pink-color); stroke: transparent; filter: drop-shadow(0 0 8px var(--pink-glow)); }
       }
      
       @keyframes fadeIn { to { opacity: 1; } }
      
       @keyframes twinkle {
           0%, 100% { fill: var(--bg-color); filter: drop-shadow(0 0 0px transparent); }
           50% { fill: #ffffff; filter: drop-shadow(0 0 5px #ffffff); }
       }


       @keyframes slideFadeUp {
           0% { opacity: 0; transform: translateY(20px); letter-spacing: 20px; filter: blur(8px); }
           100% { opacity: 1; transform: translateY(0); letter-spacing: 8px; filter: blur(0px); }
       }
      
       @keyframes shimmer { to { background-position: 200% center; } }
      
       @keyframes breathe {
           0%, 100% { filter: drop-shadow(0 0 2px rgba(245, 145, 175, 0.2)); transform: scale(1); }
           50% { filter: drop-shadow(0 0 12px rgba(245, 145, 175, 0.8)); transform: scale(1.02); }
       }


       @keyframes fall {
           0% { top: -30px; opacity: 0; }
           15% { opacity: var(--max-opacity, 0.7); }
           85% { opacity: var(--max-opacity, 0.7); }
           100% { top: 100vh; opacity: 0; }
       }


       @keyframes sway {
           0% { transform: translateX(calc(var(--drift) * -50px)); }
           100% { transform: translateX(calc(var(--drift) * 50px)); }
       }


       @keyframes tumble {
           0% { transform: rotate3d(1, 1, 0, 0deg) rotateZ(0deg); }
           50% { transform: rotate3d(1, 0.5, 0.5, 180deg) rotateZ(90deg); }
           100% { transform: rotate3d(1, 1, 1.5, 360deg) rotateZ(180deg); }
       }
      
       @keyframes float {
           0% { transform: translateY(0px) scale(1) rotateX(0deg); }
           50% { transform: translateY(-8px) scale(1.02) rotateX(5deg); }
           100% { transform: translateY(0px) scale(1) rotateX(0deg); }
       }


       /* --- Main Content --- */
       #main-content {
           display: flex;
           flex-direction: column;
           align-items: center;
           justify-content: center;
           height: 100vh;
           color: white;
           opacity: 0;
           position: relative;
           z-index: 10;
           transition: opacity 1.5s ease-in 0.3s;
           background: rgba(0, 0, 0, 0.4);
           backdrop-filter: blur(4px);
           -webkit-backdrop-filter: blur(4px);
       }
      
       #main-content h1 {
           font-size: 3.5rem;
           font-weight: 300;
           letter-spacing: 3px;
           margin-bottom: 10px;
           background: linear-gradient(90deg, #fff, var(--pink-color));
           -webkit-background-clip: text;
           -webkit-text-fill-color: transparent;
       }
   </style>
</head>
<body>


   <!-- Unblockable Code-Generated Animated Background -->
   <div id="animated-bg"></div>
   <div id="bg-overlay"></div>


   <!-- Interaction Screen to allow Audio context -->
   <div id="start-screen">
       <button id="start-btn">Enter Experience</button>
   </div>


   <!-- Loading Screen -->
   <div id="loader-container">
       <div id="particles"></div>
      
       <div class="logo-wrapper" id="logo-parallax">
           <div class="logo-inner">
               <svg viewBox="0 0 300 200" xmlns="http://www.w3.org/2000/svg">
                   <g transform="translate(10, 10)">
                       <!-- Main Stem -->
                       <path class="animated-path stroke-shape" style="--draw-delay: 0s;" d="M 30 130 Q 90 170 190 90" />
                      
                       <!-- Bud 1 -->
                       <path class="animated-path stroke-shape" style="--draw-delay: 0.3s;" d="M 85 130 Q 80 90 70 80" />
                       <ellipse class="fill-shape animated-path" style="--draw-delay: 0.3s; --fill-delay: 1.5s;" cx="65" cy="73" rx="5" ry="8" transform="rotate(-30 65 73)" />
                      
                       <!-- Bud 2 -->
                       <path class="animated-path stroke-shape" style="--draw-delay: 0.6s;" d="M 98 120 Q 115 105 125 105" />
                       <ellipse class="fill-shape animated-path" style="--draw-delay: 0.6s; --fill-delay: 1.8s;" cx="132" cy="102" rx="4.5" ry="7" transform="rotate(45 132 102)" />


                       <!-- Leaf -->
                       <path class="fill-shape animated-path" style="--draw-delay: 0.8s; --fill-delay: 2.0s;" d="M 95 142 C 130 165 180 155 190 145 C 160 145 120 138 95 142 Z" />


                       <!-- Main Flower Petals -->
                       <g transform="translate(190, 90)">
                           <path class="fill-shape animated-path" style="--draw-delay: 1.0s; --fill-delay: 2.2s;" d="M 0 0 C -22 -18 -32 -48 -12 -55 C -2 -58 8 -45 8 -45 C 8 -45 18 -58 28 -55 C 48 -48 42 -18 0 0 Z" transform="rotate(-30)" />
                           <path class="fill-shape animated-path" style="--draw-delay: 1.2s; --fill-delay: 2.4s;" d="M 0 0 C -22 -18 -32 -48 -12 -55 C -2 -58 8 -45 8 -45 C 8 -45 18 -58 28 -55 C 48 -48 42 -18 0 0 Z" transform="rotate(42)" />
                           <path class="fill-shape animated-path" style="--draw-delay: 1.4s; --fill-delay: 2.6s;" d="M 0 0 C -22 -18 -32 -48 -12 -55 C -2 -58 8 -45 8 -45 C 8 -45 18 -58 28 -55 C 48 -48 42 -18 0 0 Z" transform="rotate(114)" />
                           <path class="fill-shape animated-path" style="--draw-delay: 1.6s; --fill-delay: 2.8s;" d="M 0 0 C -22 -18 -32 -48 -12 -55 C -2 -58 8 -45 8 -45 C 8 -45 18 -58 28 -55 C 48 -48 42 -18 0 0 Z" transform="rotate(186)" />
                           <path class="fill-shape animated-path" style="--draw-delay: 1.8s; --fill-delay: 3.0s;" d="M 0 0 C -22 -18 -32 -48 -12 -55 C -2 -58 8 -45 8 -45 C 8 -45 18 -58 28 -55 C 48 -48 42 -18 0 0 Z" transform="rotate(258)" />


                           <!-- Stamens -->
                           <path class="stamen-line" style="--draw-delay: 2.2s;" d="M 0 0 L -8 -15" />
                           <path class="stamen-line" style="--draw-delay: 2.3s;" d="M 0 0 L 5 -18" />
                           <path class="stamen-line" style="--draw-delay: 2.4s;" d="M 0 0 L 16 -5" />
                           <path class="stamen-line" style="--draw-delay: 2.5s;" d="M 0 0 L 8 12" />
                           <path class="stamen-line" style="--draw-delay: 2.6s;" d="M 0 0 L -12 8" />


                           <circle class="stamen-dot" style="--draw-delay: 2.7s;" cx="-9" cy="-16" r="1.5" />
                           <circle class="stamen-dot" style="--draw-delay: 2.8s;" cx="6" cy="-19" r="1.5" />
                           <circle class="stamen-dot" style="--draw-delay: 2.9s;" cx="17" cy="-6" r="1.5" />
                           <circle class="stamen-dot" style="--draw-delay: 3.0s;" cx="9" cy="13" r="1.5" />
                           <circle class="stamen-dot" style="--draw-delay: 3.1s;" cx="-13" cy="9" r="1.5" />
                       </g>
                   </g>
               </svg>
           </div>
       </div>
       <div class="loading-text">CHERRY BLOSSOM</div>
   </div>


   <!-- Main Content -->
   <div id="main-content">
       <h1>Welcome In</h1>
       <p style="color: #999; font-weight: 300; font-size: 1.1rem;">Your experience is ready.</p>
   </div>


   <script>
       // --- Web Audio SFX Synthesizer ---
       let audioCtx;


       function initAudio() {
           audioCtx = new (window.AudioContext || window.webkitAudioContext)();
       }


       // Plays a soft bell/chime sound
       function playChime(freq, delay, duration = 1.5, volume = 0.05) {
           setTimeout(() => {
               if(audioCtx.state === 'suspended') audioCtx.resume();
               const osc = audioCtx.createOscillator();
               const gainNode = audioCtx.createGain();
              
               osc.type = 'sine'; // Soft tone
               osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
              
               gainNode.gain.setValueAtTime(0, audioCtx.currentTime);
               gainNode.gain.linearRampToValueAtTime(volume, audioCtx.currentTime + 0.05);
               gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + duration);
              
               osc.connect(gainNode);
               gainNode.connect(audioCtx.destination);
              
               osc.start();
               osc.stop(audioCtx.currentTime + duration);
           }, delay * 1000);
       }


       // Plays a magical resolving chord
       function playChord(delay) {
           setTimeout(() => {
               playChime(523.25, 0, 3, 0.04); // C5
               playChime(659.25, 0.05, 3, 0.04); // E5
               playChime(783.99, 0.1, 3, 0.04); // G5
               playChime(1046.50, 0.15, 3, 0.04); // C6
           }, delay * 1000);
       }


       // Plays a soft magical "whoosh" for the exit
       function playSweep(delay) {
           setTimeout(() => {
               const osc = audioCtx.createOscillator();
               const gain = audioCtx.createGain();
              
               osc.type = 'triangle';
               osc.frequency.setValueAtTime(300, audioCtx.currentTime);
               osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 1.2);
              
               gain.gain.setValueAtTime(0, audioCtx.currentTime);
               gain.gain.linearRampToValueAtTime(0.08, audioCtx.currentTime + 0.5);
               gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 1.2);
              
               osc.connect(gain);
               gain.connect(audioCtx.destination);
              
               osc.start();
               osc.stop(audioCtx.currentTime + 1.2);
           }, delay * 1000);
       }


       function playAudioSequence() {
           // Pentatonic scale matching the animation timings
           playChime(523.25, 0.0); // Stem
           playChime(587.33, 0.3); // Bud 1
           playChime(659.25, 0.6); // Bud 2
           playChime(783.99, 0.8); // Leaf
          
           // Petals unfurling
           playChime(880.00, 1.0);
           playChime(1046.50, 1.2);
           playChime(1174.66, 1.4);
           playChime(1318.51, 1.6);
           playChime(1567.98, 1.8);
          
           // Big text reveal chord
           playChord(1.5);
          
           // Stamen twinkles
           playChime(1046.50, 2.7, 0.5, 0.02);
           playChime(1318.51, 2.8, 0.5, 0.02);
           playChime(1567.98, 2.9, 0.5, 0.02);
           playChime(2093.00, 3.0, 0.5, 0.02);
           playChime(2637.02, 3.1, 0.5, 0.02);
          
           // Fade out sound
           playSweep(6.0);
       }


       // --- Interactive Parallax Effect ---
       const logo = document.getElementById('logo-parallax');
       document.addEventListener('mousemove', (e) => {
           const mouseX = (e.clientX / window.innerWidth) * 2 - 1;
           const mouseY = (e.clientY / window.innerHeight) * 2 - 1;
           logo.style.setProperty('--mouseX', mouseX);
           logo.style.setProperty('--mouseY', mouseY);
       });


       // --- Advanced Particle Physics System ---
       const particleContainer = document.getElementById('particles');
       let particleInterval;


       function createPetal() {
           // The wrapper handles the falling and swaying motion
           const wrapper = document.createElement('div');
           wrapper.classList.add('petal-wrapper');
          
           // The inner element handles the 3D tumbling motion
           const petal = document.createElement('div');
           petal.classList.add('petal');
          
           const startX = Math.random() * window.innerWidth;
           const duration = Math.random() * 5 + 4; // Fall duration
           const swayDuration = Math.random() * 3 + 2; // Sway back and forth duration
           const scale = Math.random() * 0.8 + 0.3;
           const drift = Math.random() * 2 - 1;
           const maxOpacity = Math.random() * 0.5 + 0.2;
          
           // 40% chance to be a distant "background" petal for a deep 3D effect
           const isBackground = Math.random() > 0.6;
           if (isBackground) {
               wrapper.style.zIndex = '-1';
               wrapper.style.filter = 'blur(6px) brightness(0.6)';
           }
          
           wrapper.style.left = `${startX}px`;
           wrapper.style.width = `${15 * scale}px`;
           wrapper.style.height = `${15 * scale}px`;
           wrapper.style.animationDuration = `${duration}s, ${swayDuration}s`;
           wrapper.style.setProperty('--drift', drift);
           wrapper.style.setProperty('--max-opacity', maxOpacity);
          
           petal.style.animationDuration = `${duration/1.5}s`;
          
           wrapper.appendChild(petal);
           particleContainer.appendChild(wrapper);
          
           setTimeout(() => wrapper.remove(), duration * 1000);
       }


       // --- Sequence Controller ---
       const startBtn = document.getElementById('start-btn');
       const startScreen = document.getElementById('start-screen');
       const loader = document.getElementById('loader-container');
       const content = document.getElementById('main-content');


       startBtn.addEventListener('click', () => {
           // 1. Initialize audio & hide start screen
           initAudio();
           startScreen.style.opacity = '0';
           startScreen.style.pointerEvents = 'none'; // Prevent blocking clicks
          
           // 2. Start visual and audio sequences
           setTimeout(() => {
               loader.classList.add('active'); // Triggers all CSS animations
               // Spawning petals slightly faster now that some are in the background
               particleInterval = setInterval(createPetal, 80);
               playAudioSequence();
              
               // 3. Handle the dramatic exit
               const loadingDuration = 6000;
               setTimeout(() => {
                   loader.classList.add('fade-out');
                   clearInterval(particleInterval);


                   setTimeout(() => {
                       loader.style.display = 'none';
                       document.body.style.overflow = 'auto';
                       content.style.opacity = '1';
                   }, 1200);
               }, loadingDuration);
              
           }, 500); // Wait a half second after clicking to start
       });
   </script>
</body>
</html>
